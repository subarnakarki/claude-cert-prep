name: Deploy to GitHub Pages

# Builds the static version of the site (manage.py build_site) and publishes it.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      DATABASE_PATH: ${{ runner.temp }}/build.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: Load content into a throwaway database
        run: uv run python manage.py migrate --noinput
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the static site
        # base_path is "/<repo>" for a project page, or "" with a custom domain.
        run: uv run python manage.py build_site --out _site --base-url "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
